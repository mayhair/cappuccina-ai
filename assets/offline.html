<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef0fb" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Cappuccina</title>
    <style>
      :root {
        --page-bg: #eef0fb;
        --card-bg: rgba(255, 255, 255, 0.64);
        --ink: #2c3151;
        --ink-soft: #3e4468;
        --hairline: rgba(44, 49, 81, 0.18);
        --btn-bg: #b02e74;
        --btn-ink: #ffffff;
        --shadow: 0 10px 30px rgba(64, 62, 96, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #10162a;
          --card-bg: rgba(19, 24, 40, 0.62);
          --ink: #eef0f6;
          --ink-soft: #b9bfd4;
          --hairline: rgba(238, 240, 246, 0.16);
          --btn-bg: #ffa8d6;
          --btn-ink: #10162a;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--page-bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        border: 1px solid var(--hairline);
        border-radius: 24px;
        background: var(--card-bg);
        box-shadow: var(--shadow);
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 14px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 22px; color: var(--ink-soft); line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        background: var(--btn-bg);
        color: var(--btn-ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--ink-soft); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Ballerina Cappuccina" width="96" height="96" />
      <h1>You are offline</h1>
      <p>Cappuccina needs an internet connection to chat. Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
